events {}
http {
 include /etc/nginx/mime.types;
 server {
 listen 8080;
 root /usr/share/nginx/html;
 location = /healthz { return 200 'ready'; }
 location /api/upload/ { proxy_pass http://app-upload:3000/; }
 location /api/watch/ { proxy_pass http://app-watch:3000/; }
 location /api/search/ { proxy_pass http://app-search:3000/; }
 location /media/ { proxy_pass http://local-objects:3902/; proxy_set_header Host transcoded.web.garage.localhost; add_header Cache-Control 'public, max-age=31536000, immutable'; }
 location / { try_files $uri $uri/ /index.html; }
 }
}
