events {}
http {
  # Callback codes and other temporary capabilities must never enter access logs.
  access_log off;
  error_log /dev/stderr warn;
  include /etc/nginx/mime.types;
  resolver 127.0.0.11 valid=10s;
  proxy_cache_path /var/cache/nginx/media levels=1:2 keys_zone=media:10m max_size=512m inactive=1h;
  map $uri $media_cache_control { default "public, max-age=31536000, immutable"; ~\.m3u8$ "public, max-age=60"; }
  server {
    listen 8080;
    root /usr/share/nginx/html;
    location = /healthz { return 200 'edge shell running'; }
    location /api/watch/ { set $backend app-watch:3000; rewrite ^/api/watch/(.*)$ /$1 break; proxy_pass http://$backend; }
    location /api/search/ { set $backend app-search:3000; rewrite ^/api/search/(.*)$ /$1 break; proxy_pass http://$backend; }
    location /api/upload/ { set $backend app-upload:3000; rewrite ^/api/upload/(.*)$ /$1 break; proxy_pass http://$backend; }
    location /media/ {
      set $backend local-objects:3902;
      rewrite ^/media/(.*)$ /$1 break;
      proxy_pass http://$backend;
      proxy_set_header Host transcoded.web.garage.localhost;
      proxy_cache media;
      proxy_cache_key $uri;
      proxy_cache_valid 200 1m;
      proxy_cache_valid 404 0;
      proxy_cache_bypass $http_range;
      proxy_no_cache $http_range;
      proxy_set_header Range $http_range;
      proxy_set_header If-Range $http_if_range;
      proxy_hide_header Cache-Control;
      add_header Cache-Control $media_cache_control;
    }
  }
}
