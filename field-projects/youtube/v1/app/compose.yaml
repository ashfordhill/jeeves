{
  "secrets": {
    "broker_password": {
      "file": ".runtime/secrets/broker_password"
    },
    "cache_password": {
      "file": ".runtime/secrets/cache_password"
    },
    "counts_owner": {
      "file": ".runtime/secrets/counts_owner"
    },
    "counts_reader": {
      "file": ".runtime/secrets/counts_reader"
    },
    "garage.toml": {
      "file": ".runtime/secrets/garage.toml"
    },
    "identity.env": {
      "file": ".runtime/secrets/identity.env"
    },
    "identity_password": {
      "file": ".runtime/secrets/identity_password"
    },
    "metadata_owner": {
      "file": ".runtime/secrets/metadata_owner"
    },
    "metadata_reader": {
      "file": ".runtime/secrets/metadata_reader"
    },
    "postgres_admin": {
      "file": ".runtime/secrets/postgres_admin"
    },
    "realm.json": {
      "file": ".runtime/secrets/realm.json"
    },
    "transcoder_s3": {
      "file": ".runtime/secrets/transcoder_s3"
    },
    "upload_s3": {
      "file": ".runtime/secrets/upload_s3"
    },
    "metadata_upload": {
      "file": ".runtime/secrets/metadata_upload"
    },
    "metadata_lifecycle": {
      "file": ".runtime/secrets/metadata_lifecycle"
    },
    "counts_writer": {
      "file": ".runtime/secrets/counts_writer"
    }
  },
  "services": {
    "broker": {
      "entrypoint": [
        "sh",
        "-ec",
        "export RABBITMQ_DEFAULT_PASS=\"$$(cat /run/secrets/broker_password)\"; exec docker-entrypoint.sh rabbitmq-server"
      ],
      "environment": {
        "RABBITMQ_DEFAULT_USER": "youtube"
      },
      "healthcheck": {
        "interval": "5s",
        "retries": 30,
        "start_period": "20s",
        "test": [
          "CMD",
          "rabbitmq-diagnostics",
          "-q",
          "ping"
        ],
        "timeout": "5s"
      },
      "image": "rabbitmq:4.4.0-management-alpine@sha256:4841f6384ef8313c3594cd3f2e9f40c10805f8a61c45f08a9a5d9ddea8199267",
      "secrets": [
        "broker_password"
      ],
      "volumes": [
        "broker-data:/var/lib/rabbitmq"
      ]
    },
    "broker-init": {
      "build": {
        "context": ".",
        "target": "app"
      },
      "command": [
        "node",
        "scripts/broker-init.mjs"
      ],
      "depends_on": {
        "broker": {
          "condition": "service_healthy"
        }
      },
      "image": "${COMPOSE_PROJECT_NAME:-youtube-v1}-app",
      "init": true,
      "profiles": [
        "setup"
      ],
      "secrets": [
        "broker_password"
      ]
    },
    "cache": {
      "command": [
        "sh",
        "-ec",
        "exec valkey-server --requirepass \"$$(cat /run/secrets/cache_password)\" --maxmemory 128mb --maxmemory-policy allkeys-lru --appendonly yes"
      ],
      "healthcheck": {
        "interval": "5s",
        "retries": 30,
        "start_period": "20s",
        "test": [
          "CMD-SHELL",
          "REDISCLI_AUTH=\"$$(cat /run/secrets/cache_password)\" valkey-cli ping | grep -q PONG"
        ],
        "timeout": "5s"
      },
      "image": "valkey/valkey:8.1.10-alpine@sha256:081c2f5cb575efc901aa80ff9cdbd1ec6a301682fd35e1ebb4b0990a4a4a8507",
      "secrets": [
        "cache_password"
      ],
      "volumes": [
        "cache-data:/data"
      ]
    },
    "completion-handler": {
      "build": {
        "context": ".",
        "target": "app"
      },
      "command": [
        "node",
        "dist/workers/completion-handler.js"
      ],
      "depends_on": {
        "broker": {
          "condition": "service_healthy"
        }
      },
      "environment": {
        "OIDC_ISSUER": "http://127.0.0.1:4401/realms/youtube-v1",
        "PUBLIC_S3_ENDPOINT": "http://127.0.0.1:4402"
      },
      "healthcheck": {
        "interval": "5s",
        "retries": 30,
        "start_period": "20s",
        "test": [
          "CMD",
          "node",
          "-e",
          "require('node:fs').accessSync('/tmp/shell-ready')"
        ],
        "timeout": "5s"
      },
      "image": "${COMPOSE_PROJECT_NAME:-youtube-v1}-app",
      "init": true,
      "secrets": [
        "broker_password",
        "metadata_lifecycle"
      ],
      "profiles": [
        "application"
      ]
    },
    "edge": {
      "healthcheck": {
        "interval": "5s",
        "retries": 30,
        "start_period": "20s",
        "test": [
          "CMD",
          "wget",
          "-qO-",
          "http://127.0.0.1:8080/healthz"
        ],
        "timeout": "5s"
      },
      "image": "nginx:1.28.3-alpine@sha256:a8b39bd9cf0f83869a2162827a0caf6137ddf759d50a171451b335cecc87d236",
      "ports": [
        "127.0.0.1:4400:8080"
      ],
      "volumes": [
        "./infra/edge/nginx.conf:/etc/nginx/nginx.conf:ro",
        "./public:/usr/share/nginx/html:ro",
        "edge-cache:/var/cache/nginx"
      ],
      "profiles": [
        "application"
      ]
    },
    "identity": {
      "command": [
        "start-dev",
        "--import-realm"
      ],
      "depends_on": {
        "postgres": {
          "condition": "service_healthy"
        }
      },
      "env_file": [
        ".runtime/secrets/identity.env"
      ],
      "environment": {
        "KC_DB": "postgres",
        "KC_DB_URL": "jdbc:postgresql://postgres:5432/identity",
        "KC_DB_USERNAME": "identity_owner",
        "KC_HEALTH_ENABLED": "true",
        "KC_HOSTNAME": "http://127.0.0.1:4401",
        "KC_HTTP_ENABLED": "true"
      },
      "healthcheck": {
        "interval": "5s",
        "retries": 30,
        "start_period": "20s",
        "test": [
          "CMD-SHELL",
          "bash -ec 'exec 3<>/dev/tcp/127.0.0.1/9000; printf \"GET /health/ready HTTP/1.0\\r\\n\\r\\n\" >&3; cat <&3 | grep -q UP'"
        ],
        "timeout": "5s"
      },
      "image": "quay.io/keycloak/keycloak:26.8.1@sha256:3f3c5f8e03c614774b4bd9173b88391fefa4153bfc010d8012d59ad825377332",
      "ports": [
        "127.0.0.1:4401:8080"
      ],
      "volumes": [
        "./.runtime/secrets/realm.json:/opt/keycloak/data/import/realm.json:ro"
      ]
    },
    "objects": {
      "healthcheck": {
        "interval": "5s",
        "retries": 30,
        "start_period": "20s",
        "test": [
          "CMD",
          "/garage",
          "status"
        ],
        "timeout": "5s"
      },
      "image": "dxflrs/garage:v2.4.1@sha256:9c96caa2612d3411acc5b0e6701fb238dbfba33e533a6d7d3d811a4b12d0d020",
      "ports": [
        "127.0.0.1:4402:3900"
      ],
      "secrets": [
        {
          "source": "garage.toml",
          "target": "/etc/garage.toml"
        }
      ],
      "volumes": [
        "objects-data:/var/lib/garage"
      ]
    },
    "postgres": {
      "environment": {
        "POSTGRES_PASSWORD_FILE": "/run/secrets/postgres_admin",
        "POSTGRES_USER": "postgres"
      },
      "healthcheck": {
        "interval": "5s",
        "retries": 30,
        "start_period": "20s",
        "test": [
          "CMD-SHELL",
          "pg_isready -U postgres -d postgres"
        ],
        "timeout": "5s"
      },
      "image": "postgres:17.11-alpine3.23@sha256:bc2701f9a79f9248bcb18743bc9b2c732d9a1d16737ca44a8f577752fc43b61f",
      "secrets": [
        "postgres_admin",
        "metadata_owner",
        "metadata_reader",
        "counts_owner",
        "counts_reader",
        "identity_password"
      ],
      "volumes": [
        "postgres-data:/var/lib/postgresql/data",
        "./infra/postgres/init.sh:/docker-entrypoint-initdb.d/10-init.sh:ro"
      ]
    },
    "search": {
      "build": {
        "context": ".",
        "target": "app"
      },
      "command": [
        "node",
        "dist/services/search.js"
      ],
      "depends_on": {},
      "environment": {
        "OIDC_ISSUER": "http://127.0.0.1:4401/realms/youtube-v1",
        "PUBLIC_S3_ENDPOINT": "http://127.0.0.1:4402"
      },
      "healthcheck": {
        "interval": "5s",
        "retries": 30,
        "start_period": "20s",
        "test": [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/healthz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
        ],
        "timeout": "5s"
      },
      "image": "${COMPOSE_PROJECT_NAME:-youtube-v1}-app",
      "init": true,
      "secrets": [],
      "profiles": [
        "application"
      ]
    },
    "search-index": {
      "environment": {
        "DISABLE_INSTALL_DEMO_CONFIG": "true",
        "DISABLE_SECURITY_PLUGIN": "true",
        "OPENSEARCH_JAVA_OPTS": "-Xms512m -Xmx512m",
        "discovery.type": "single-node"
      },
      "healthcheck": {
        "interval": "5s",
        "retries": 30,
        "start_period": "20s",
        "test": [
          "CMD-SHELL",
          "curl -fsS http://localhost:9200/_cluster/health?wait_for_status=yellow >/dev/null"
        ],
        "timeout": "5s"
      },
      "image": "opensearchproject/opensearch:3.9.0@sha256:3b55f6b6249cfdb92b52ee59adc8a266203ba9ef9f5d82544fad6f1af2f3609e",
      "ulimits": {
        "memlock": {
          "hard": -1,
          "soft": -1
        }
      },
      "volumes": [
        "search-data:/usr/share/opensearch/data"
      ]
    },
    "search-indexer": {
      "build": {
        "context": ".",
        "target": "app"
      },
      "command": [
        "node",
        "dist/workers/search-indexer.js"
      ],
      "depends_on": {
        "broker": {
          "condition": "service_healthy"
        }
      },
      "environment": {
        "OIDC_ISSUER": "http://127.0.0.1:4401/realms/youtube-v1",
        "PUBLIC_S3_ENDPOINT": "http://127.0.0.1:4402"
      },
      "healthcheck": {
        "interval": "5s",
        "retries": 30,
        "start_period": "20s",
        "test": [
          "CMD",
          "node",
          "-e",
          "require('node:fs').accessSync('/tmp/shell-ready')"
        ],
        "timeout": "5s"
      },
      "image": "${COMPOSE_PROJECT_NAME:-youtube-v1}-app",
      "init": true,
      "secrets": [
        "broker_password"
      ],
      "profiles": [
        "application"
      ]
    },
    "search-init": {
      "build": {
        "context": ".",
        "target": "app"
      },
      "command": [
        "node",
        "scripts/search-init.mjs"
      ],
      "depends_on": {
        "search-index": {
          "condition": "service_healthy"
        }
      },
      "image": "${COMPOSE_PROJECT_NAME:-youtube-v1}-app",
      "init": true,
      "profiles": [
        "setup"
      ]
    },
    "storage-config": {
      "build": {
        "context": ".",
        "target": "app"
      },
      "command": [
        "node",
        "scripts/storage-config.mjs"
      ],
      "image": "${COMPOSE_PROJECT_NAME:-youtube-v1}-app",
      "init": true,
      "profiles": [
        "setup"
      ],
      "secrets": [
        {
          "source": "upload_s3",
          "target": "s3_credentials"
        }
      ]
    },
    "transcoder": {
      "build": {
        "context": ".",
        "target": "transcoder"
      },
      "command": [
        "node",
        "dist/workers/transcoder.js"
      ],
      "depends_on": {
        "broker": {
          "condition": "service_healthy"
        }
      },
      "environment": {
        "OIDC_ISSUER": "http://127.0.0.1:4401/realms/youtube-v1",
        "PUBLIC_S3_ENDPOINT": "http://127.0.0.1:4402"
      },
      "healthcheck": {
        "interval": "5s",
        "retries": 30,
        "start_period": "20s",
        "test": [
          "CMD",
          "node",
          "-e",
          "require('node:fs').accessSync('/tmp/shell-ready')"
        ],
        "timeout": "5s"
      },
      "image": "${COMPOSE_PROJECT_NAME:-youtube-v1}-transcoder",
      "init": true,
      "secrets": [
        "broker_password",
        {
          "source": "transcoder_s3",
          "target": "s3_credentials"
        }
      ],
      "profiles": [
        "application"
      ]
    },
    "upload": {
      "build": {
        "context": ".",
        "target": "app"
      },
      "command": [
        "node",
        "dist/services/upload.js"
      ],
      "depends_on": {},
      "environment": {
        "OIDC_ISSUER": "http://127.0.0.1:4401/realms/youtube-v1",
        "PUBLIC_S3_ENDPOINT": "http://127.0.0.1:4402"
      },
      "healthcheck": {
        "interval": "5s",
        "retries": 30,
        "start_period": "20s",
        "test": [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/healthz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
        ],
        "timeout": "5s"
      },
      "image": "${COMPOSE_PROJECT_NAME:-youtube-v1}-app",
      "init": true,
      "secrets": [
        "broker_password",
        {
          "source": "upload_s3",
          "target": "s3_credentials"
        },
        "metadata_upload"
      ],
      "profiles": [
        "application"
      ]
    },
    "view-counter": {
      "build": {
        "context": ".",
        "target": "app"
      },
      "command": [
        "node",
        "dist/workers/view-counter.js"
      ],
      "depends_on": {
        "broker": {
          "condition": "service_healthy"
        }
      },
      "environment": {
        "OIDC_ISSUER": "http://127.0.0.1:4401/realms/youtube-v1",
        "PUBLIC_S3_ENDPOINT": "http://127.0.0.1:4402"
      },
      "healthcheck": {
        "interval": "5s",
        "retries": 30,
        "start_period": "20s",
        "test": [
          "CMD",
          "node",
          "-e",
          "require('node:fs').accessSync('/tmp/shell-ready')"
        ],
        "timeout": "5s"
      },
      "image": "${COMPOSE_PROJECT_NAME:-youtube-v1}-app",
      "init": true,
      "secrets": [
        "broker_password",
        "counts_writer"
      ],
      "profiles": [
        "application"
      ]
    },
    "watch": {
      "build": {
        "context": ".",
        "target": "app"
      },
      "command": [
        "node",
        "dist/services/watch.js"
      ],
      "depends_on": {},
      "environment": {
        "OIDC_ISSUER": "http://127.0.0.1:4401/realms/youtube-v1",
        "PUBLIC_S3_ENDPOINT": "http://127.0.0.1:4402"
      },
      "healthcheck": {
        "interval": "5s",
        "retries": 30,
        "start_period": "20s",
        "test": [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/healthz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
        ],
        "timeout": "5s"
      },
      "image": "${COMPOSE_PROJECT_NAME:-youtube-v1}-app",
      "init": true,
      "secrets": [
        "broker_password",
        "metadata_reader",
        "counts_reader",
        "cache_password"
      ],
      "profiles": [
        "application"
      ]
    },
    "migrate": {
      "build": {
        "context": ".",
        "target": "app"
      },
      "image": "${COMPOSE_PROJECT_NAME:-youtube-v1}-app",
      "init": true,
      "profiles": [
        "setup"
      ],
      "command": [
        "node",
        "scripts/migrate.mjs"
      ],
      "depends_on": {
        "postgres": {
          "condition": "service_healthy"
        }
      },
      "secrets": [
        "postgres_admin",
        "metadata_owner",
        "counts_owner",
        "metadata_upload",
        "metadata_lifecycle",
        "counts_writer"
      ]
    }
  },
  "volumes": {
    "broker-data": {},
    "cache-data": {},
    "edge-cache": {},
    "objects-data": {},
    "postgres-data": {},
    "search-data": {}
  }
}
