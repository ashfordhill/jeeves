events {}
http {
  access_log off;
  error_log /dev/stderr warn;
  resolver 127.0.0.11 valid=10s;
  types { }
  default_type application/json;
  map $uri $cdn_type {
    default $upstream_http_content_type;
    ~*\.m3u8$ application/vnd.apple.mpegurl;
    ~*\.ts$ video/mp2t;
    ~*\.m4s$ video/iso.segment;
    ~*\.mp4$ video/mp4;
    ~*\.webm$ video/webm;
    ~*\.m4a$ audio/mp4;
    ~*\.mp3$ audio/mpeg;
    ~*\.aac$ audio/aac;
    ~*\.vtt$ text/vtt;
    ~*\.jpe?g$ image/jpeg;
    ~*\.png$ image/png;
    ~*\.webp$ image/webp;
    ~*\.gif$ image/gif;
    ~*\.avif$ image/avif;
    ~*\.svg$ image/svg+xml;
    ~*\.json$ application/json;
    ~*\.txt$ text/plain;
  }
  server {
    listen 8080;
    error_page 502 504 = @unavailable;
    location = /healthz { return 200 '{"service":"edge","application":"ready"}'; }
    location /api/account-api/ { set $backend app-account-api:3000; rewrite ^/api/account-api/(.*)$ /$1 break; proxy_pass http://$backend; }
    location /api/search-api/ { set $backend app-search-api:3000; rewrite ^/api/search-api/(.*)$ /$1 break; proxy_pass http://$backend; }
    location /api/upload-api/ { set $backend app-upload-api:3000; rewrite ^/api/upload-api/(.*)$ /$1 break; proxy_pass http://$backend; }
    location /api/watch-api/ { set $backend app-watch-api:3000; rewrite ^/api/watch-api/(.*)$ /$1 break; proxy_pass http://$backend; }
    location /cdn/video-delivery/ {
      if ($request_method !~ ^(GET|HEAD)$ ) { return 405 '{"error":"METHOD_NOT_ALLOWED","message":"This route only reads."}'; }
      set $objects local-objects:3902;
      rewrite ^/cdn/video-delivery/(.*)$ /$1 break;
      proxy_pass http://$objects;
      proxy_set_header Host transcoded-videos.web.garage.localhost;
      proxy_set_header Authorization "";
      proxy_set_header Cookie "";
      proxy_intercept_errors on;
      error_page 403 404 = @cdn-missing;
      error_page 502 504 = @unavailable;
      proxy_hide_header Content-Type;
      add_header Content-Type $cdn_type;
      add_header X-Content-Type-Options nosniff;
      add_header Content-Security-Policy "sandbox";
    }
    location @cdn-missing { return 404 '{"error":"NOT_FOUND","message":"No object for this key."}'; }
    location @unavailable { return 503 '{"error":"UNAVAILABLE","message":"Service unavailable."}'; }
    location / { return 404 '{"error":"NOT_FOUND","message":"Route not found."}'; }
  }
}
