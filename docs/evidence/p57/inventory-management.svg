<svg xmlns="http://www.w3.org/2000/svg" viewBox="-32 -100 1512 512" width="1512" height="512" role="img" aria-labelledby="title desc"><title id="title">Management</title><desc id="desc">Architecture intent. Design cd0cba6281848d49f897f7569ec95b54b3301eb40be84621853d7ebae8aacd04. Layout 360826a6a71a056a2bed987d9fb641057aa5990566aba2bd13eb210c5f9256ce. Planned responsibilities have no runtime implementation.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/></marker></defs><rect x="-32" y="-100" width="1512" height="512" fill="#fffdf8"/><g font-family="Arial, sans-serif" fill="#182c3a"><text x="-8" y="-68" font-size="22" font-weight="700"><tspan x="-8" dy="0">Management</tspan></text><text x="-8" y="-43" font-size="13" font-weight="400"><tspan x="-8" dy="0">View: focus-management · Commit stock change / main · Unverified architecture intent</tspan></text><rect x="28" y="48" width="1404" height="264" rx="12" fill="#eef3f6" stroke="#8294a5" stroke-dasharray="6 4"/><text x="40" y="70" font-size="14" font-weight="700"><tspan x="40" dy="0">Inventory reuse study</tspan></text><path d="M 856,190 L 1152,190" fill="none" stroke="#475569" stroke-width="2"  marker-end="url(#arrow)"/><path d="M 308,190 L 604,190" fill="none" stroke="#475569" stroke-width="2"  marker-end="url(#arrow)"/><g data-identity="container:api"><rect x="604" y="96" width="252" height="188" rx="10" fill="#edf3ff" stroke="#31576d" stroke-width="2" stroke-dasharray="6 3"/><text x="618" y="123" font-size="16" font-weight="700"><tspan x="618" dy="0">Application API</tspan></text><text x="618" y="167" font-size="13" font-weight="400"><tspan x="618" dy="0">Owns tenant-authorized product</tspan><tspan x="618" dy="17">operations and authoritative</tspan><tspan x="618" dy="17">state.</tspan></text><text x="618" y="249" font-size="12" font-weight="400"><tspan x="618" dy="0">TypeScript (proposed)</tspan></text><text x="618" y="269" font-size="12" font-weight="700"><tspan x="618" dy="0">PLANNED · implementation required</tspan></text></g><g data-identity="container:db"><rect x="1152" y="96" width="252" height="188" rx="10" fill="#edf3ff" stroke="#31576d" stroke-width="2" stroke-dasharray="6 3"/><text x="1166" y="123" font-size="16" font-weight="700"><tspan x="1166" dy="0">Primary data</tspan></text><text x="1166" y="167" font-size="13" font-weight="400"><tspan x="1166" dy="0">Authoritative tenant records and</tspan><tspan x="1166" dy="17">product data; shared scoped</tspan><tspan x="1166" dy="17">storage.</tspan></text><text x="1166" y="249" font-size="12" font-weight="400"><tspan x="1166" dy="0">PostgreSQL (proposed)</tspan></text><text x="1166" y="269" font-size="12" font-weight="700"><tspan x="1166" dy="0">PLANNED · implementation required</tspan></text></g><g data-identity="container:web"><rect x="56" y="96" width="252" height="188" rx="10" fill="#edf3ff" stroke="#31576d" stroke-width="2" stroke-dasharray="6 3"/><text x="70" y="123" font-size="16" font-weight="700"><tspan x="70" dy="0">Inventory workspace</tspan></text><text x="70" y="167" font-size="13" font-weight="400"><tspan x="70" dy="0">Signed-in feature areas using</tspan><tspan x="70" dy="17">exact tenant-scoped API</tspan><tspan x="70" dy="17">contracts.</tspan></text><text x="70" y="249" font-size="12" font-weight="400"><tspan x="70" dy="0">TypeScript (proposed)</tspan></text><text x="70" y="269" font-size="12" font-weight="700"><tspan x="70" dy="0">PLANNED · implementation required</tspan></text></g><g><rect x="884" y="120.5" width="240" height="138" rx="4" fill="#fffdf8"/><text x="889" y="136.5" font-size="12" font-weight="400"><tspan x="889" dy="0">3, 4. Reads / writes</tspan><tspan x="889" dy="16">authoritative data · SQL</tspan></text></g><g><rect x="336" y="120.5" width="240" height="138" rx="4" fill="#fffdf8"/><text x="341" y="136.5" font-size="12" font-weight="400"><tspan x="341" dy="0">1, 2, 5. Uses tenant product</tspan><tspan x="341" dy="16">APIs · HTTPS/JSON</tspan></text></g><text x="-8" y="362" font-size="13" font-weight="400"><tspan x="-8" dy="0">Legend: arrows show authored direction; dashed relationships = asynchronous; dotted = streaming.</tspan><tspan x="-8" dy="17">PLANNED labels are intent. Template availability and runtime verification remain separate.</tspan></text></g></svg>
