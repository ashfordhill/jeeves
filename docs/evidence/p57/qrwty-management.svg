<svg xmlns="http://www.w3.org/2000/svg" viewBox="-32 -100 1532 748" width="1532" height="748" role="img" aria-labelledby="title desc"><title id="title">Management</title><desc id="desc">Architecture intent. Design f9ff524db7d90592653d15ddd9714ed55197a3049f8c13483bd195cf2ec41e40. Layout b21658eb41f412378f537411e5f7c4f8c2f6da64036873108a3853d6f57bf312. Planned responsibilities have no runtime implementation.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/></marker></defs><rect x="-32" y="-100" width="1532" height="748" fill="#fffdf8"/><g font-family="Arial, sans-serif" fill="#182c3a"><text x="-8" y="-68" font-size="22" font-weight="700"><tspan x="-8" dy="0">Management</tspan></text><text x="-8" y="-43" font-size="13" font-weight="400"><tspan x="-8" dy="0">View: focus-management · Create or edit link, artwork and hosted content / main · Unverified architecture intent</tspan></text><rect x="28" y="48" width="1424" height="500" rx="12" fill="#eef3f6" stroke="#8294a5" stroke-dasharray="6 4"/><text x="40" y="70" font-size="14" font-weight="700"><tspan x="40" dy="0">QRWTY target architecture</tspan></text><path d="M 856,252.67 L 880,252.67 L 880,426 L 1172,426" fill="none" stroke="#475569" stroke-width="2"  marker-end="url(#arrow)"/><path d="M 308,221.33 L 604,221.33" fill="none" stroke="#475569" stroke-width="2"  marker-end="url(#arrow)"/><path d="M 856,190 L 1172,190" fill="none" stroke="#475569" stroke-width="2"  marker-end="url(#arrow)"/><g data-identity="container:api"><rect x="604" y="127.33" width="252" height="188" rx="10" fill="#edf3ff" stroke="#31576d" stroke-width="2" stroke-dasharray="6 3"/><text x="618" y="154.32999999999998" font-size="16" font-weight="700"><tspan x="618" dy="0">Application API</tspan></text><text x="618" y="198.32999999999998" font-size="13" font-weight="400"><tspan x="618" dy="0">Owns tenant-authorized product</tspan><tspan x="618" dy="17">operations and authoritative</tspan><tspan x="618" dy="17">state.</tspan></text><text x="618" y="280.33" font-size="12" font-weight="400"><tspan x="618" dy="0">TypeScript (proposed)</tspan></text><text x="618" y="300.33" font-size="12" font-weight="700"><tspan x="618" dy="0">PLANNED · implementation required</tspan></text></g><g data-identity="container:db"><rect x="1172" y="332" width="252" height="188" rx="10" fill="#edf3ff" stroke="#31576d" stroke-width="2" stroke-dasharray="6 3"/><text x="1186" y="359" font-size="16" font-weight="700"><tspan x="1186" dy="0">Primary data</tspan></text><text x="1186" y="403" font-size="13" font-weight="400"><tspan x="1186" dy="0">Authoritative tenant records and</tspan><tspan x="1186" dy="17">product data; shared scoped</tspan><tspan x="1186" dy="17">storage.</tspan></text><text x="1186" y="485" font-size="12" font-weight="400"><tspan x="1186" dy="0">PostgreSQL (proposed)</tspan></text><text x="1186" y="505" font-size="12" font-weight="700"><tspan x="1186" dy="0">PLANNED · implementation required</tspan></text></g><g data-identity="container:web"><rect x="56" y="127.33" width="252" height="188" rx="10" fill="#edf3ff" stroke="#31576d" stroke-width="2" stroke-dasharray="6 3"/><text x="70" y="154.32999999999998" font-size="16" font-weight="700"><tspan x="70" dy="0">Owner web app</tspan></text><text x="70" y="198.32999999999998" font-size="13" font-weight="400"><tspan x="70" dy="0">Signed-in feature areas using</tspan><tspan x="70" dy="17">exact tenant-scoped API</tspan><tspan x="70" dy="17">contracts.</tspan></text><text x="70" y="280.33" font-size="12" font-weight="400"><tspan x="70" dy="0">TypeScript (proposed)</tspan></text><text x="70" y="300.33" font-size="12" font-weight="700"><tspan x="70" dy="0">PLANNED · implementation required</tspan></text></g><g data-identity="container:assets"><rect x="1172" y="96" width="252" height="188" rx="10" fill="#edf3ff" stroke="#31576d" stroke-width="2" stroke-dasharr