  <text x="312" y="441" class="small">Generated capability</text>
  <rect x="575" y="359" width="218" height="102" rx="9" fill="#fff" stroke="#bacbd9"/>
  <text x="593" y="390" class="body bold">QR registry</text>
  <text x="593" y="416" class="small">Owned links and destinations</text>
  <text x="593" y="441" class="small">Generated resource</text>
  <path d="M575 408 H524" class="edge"/>
  <text x="532" y="394" font-size="9" fill="#687b8d">auth</text>
  <rect x="294" y="518" width="230" height="102" rx="9" fill="#fff" stroke="#bacbd9"/>
  <text x="312" y="549" class="body bold">QR image rendering</text>
  <text x="312" y="575" class="small">Stable URL → PNG</text>
  <text x="312" y="600" class="small">Generated module</text>
  <rect x="575" y="510" width="218" height="118" rx="9" fill="#e6f0f7" stroke="#2675a5" stroke-width="2.5"/>
  <text x="593" y="546" class="body bold">Public redirect</text>
  <text x="593" y="574" class="small">GET /q/{id} → 302</text>
  <text x="593" y="603" class="small">Generated module</text>
  <path d="M684 510 V461" class="edge"/>
  <text x="698" y="489" font-size="10" fill="#687b8d">reads QR</text>
  <rect x="294" y="681" width="230" height="102" rx="9" fill="#fff" stroke="#bacbd9"/>
  <text x="312" y="712" class="body bold">Activity queries</text>
  <text x="312" y="738" class="small">Owner-scoped daily totals</text>
  <text x="312" y="763" class="small">Generated module</text>
  <rect x="858" y="687" width="194" height="90" rx="9" fill="#eaf0f4" stroke="#bdcedd"/>
  <text x="877" y="720" class="body bold">Postgres</text>
  <text x="877" y="747" class="small">External to this scope</text>
  <path d="M793 570 H830 V720 H858" class="edge"/>
  <text x="847" y="558" class="small">persist event</text>
  <path d="M524 732 H858" class="edge"/>
  <text x="618" y="719" class="small">read events</text>
  <text x="285" y="835" class="small">Selected relationships shown · Open Behavior for the complete scan sequence</text>
  <text x="1134" y="197" class="label">COMPONENT</text>
  <text x="1134" y="234" font-size="22" font-weight="650">Public redirect</text>
  <text x="1134" y="263" class="small">Resolve a QR link and record a request.</text>
  <rect x="1134" y="286" width="340" height="36" rx="6" fill="#edf6ee"/>
  <text x="1150" y="310" class="body bold" fill="#316347">Generated behavior · version pinned</text>
  <text x="1134" y="360" class="label">BEHAVIOR CONFIGURATION</text>
  <text x="1134" y="396" class="body">Resource</text>
  <rect x="1290" y="374" width="183" height="34" rx="5" fill="#f8fafc" stroke="#cbd7e2"/>
  <text x="1302" y="397" class="body">QR link ▾</text>
  <text x="1134" y="444" class="body">Destination field</text>
  <rect x="1290" y="423" width="183" height="34" rx="5" fill="#f8fafc" stroke="#cbd7e2"/>
  <text x="1302" y="446" class="body">destination ▾</text>
  <text x="1134" y="493" class="body">Access</text>
  <text x="1302" y="493" class="body bold">Public</text>
  <text x="1134" y="533" class="body">Redirect policy</text>
  <text x="1302" y="533" class="body bold">302 · no-store</text>
  <text x="1134" y="573" class="body">Record event</text>
  <text x="1302" y="573" class="body bold">Before response</text>
  <line x1="1134" y1="601" x2="1475" y2="601" stroke="#d5dfe8"/>
  <text x="1134" y="633" class="label">LINKED EVIDENCE</text>
  <text x="1134" y="665" class="body">QR-03 · Redirect to current destination</text>
  <text x="1134" y="697" class="body">QR-04 · Destination edit stays stable</text>
  <text x="1134" y="729" class="body">QR-07 · Unknown IDs and invalid input</text>
  <rect x="1134" y="756" width="340" height="38" rx="6" fill="#fff" stroke="#bdcedd"/>
  <text x="1218" y="781" class="body bold">View scan sequence</text>
  <text x="1134" y="837" class="small">Contract and advanced configuration ▸</text>
  <rect y="930" width="1500" height="90" fill="#e7edf4"/>
  <text x="24" y="962" class="body bold">Explore responsibilities → Configure tested behavior → Preview screens → Review changes and evidence</text>
  <text x="24" y="993" class="small">C4 components describe responsibilities; template capabilities supply implementations; screen patterns describe product interactions.</text>
</svg>
