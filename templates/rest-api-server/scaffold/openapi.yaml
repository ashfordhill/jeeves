# The {{serviceName}} API contract. Project-owned: change this file first, then implement the
# handlers (src/features/<name>/index.ts, `operations: { <operationId>: handler }`). Clients are
# generated from it, so breaking changes show up as type errors in their code.
openapi: 3.1.0
info:
  title: {{serviceName}} API
  version: 0.1.0
servers:
  - url: {{basePath}}
paths:
  /ping:
    get:
      operationId: ping
      summary: Check that the API answers
      parameters:
        - name: message
          in: query
          required: false
          description: Echoed back instead of "pong".
          schema:
            type: string
            minLength: 1
            maxLength: 64
          example: hello
      responses:
        "200":
          description: The API is up
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Pong"
              example:
                message: pong
        "400":
          $ref: "#/components/responses/BadRequest"
components:
  schemas:
    Pong:
      type: object
      required: [message]
      additionalProperties: false
      properties:
        message:
          type: string
    Error:
      type: object
      required: [error, message]
      properties:
        error:
          type: string
          description: A stable code, e.g. REQUEST_INVALID or NOT_FOUND
        message:
          type: string
        details:
          type: array
          items:
            type: object
            required: [in, path, message]
            properties:
              in:
                type: string
              path:
                type: string
              message:
                type: string
  responses:
    BadRequest:
      description: The request doesn't match this contract
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
