openapi: 3.1.0
info:
  title: Links API
  version: 0.1.0
paths:
  /links:
    get:
      operationId: listLinks
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        "200":
          description: Links
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Link" } }
    post:
      operationId: createLink
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NewLink" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Link" }
        "400": { $ref: "#/components/responses/Error" }
  /links/{code}:
    parameters:
      - $ref: "#/components/parameters/Code"
    get:
      operationId: getLink
      responses:
        "200":
          description: The link
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Link" }
        "404": { $ref: "#/components/responses/Error" }
    delete:
      operationId: deleteLink
      responses:
        "204": { description: Deleted }
components:
  parameters:
    Code:
      name: code
      in: path
      required: true
      schema: { type: string, pattern: "^[a-z0-9]{2,12}$" }
  schemas:
    NewLink:
      type: object
      required: [target]
      additionalProperties: false
      properties:
        target: { type: string, format: uri }
    Link:
      type: object
      required: [code, target]
      properties:
        code: { type: string }
        target: { type: string, format: uri }
  responses:
    Error:
      description: An error
      content:
        application/json:
          schema:
            type: object
            required: [error, message]
            properties:
              error: { type: string }
              message: { type: string }
