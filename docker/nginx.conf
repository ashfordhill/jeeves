worker_processes auto;
pid /tmp/jeeves-nginx.pid;
error_log stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log off;
    sendfile on;
    server_tokens off;
    client_body_temp_path /tmp/jeeves-client-body;
    proxy_temp_path /tmp/jeeves-proxy;
    fastcgi_temp_path /tmp/jeeves-fastcgi;
    uwsgi_temp_path /tmp/jeeves-uwsgi;
    scgi_temp_path /tmp/jeeves-scgi;

    server {
        listen 4300;
        root /app/apps/web/dist;
        index index.html;
        client_max_body_size 25m;

        location /api/ {
            proxy_pass http://127.0.0.1:4310/;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Connection "";
            # Chat events are a stream; deliver each event immediately.
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 3600s;
        }

        location /assets/ {
            try_files $uri =404;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }

        location / {
            try_files $uri $uri/ /index.html;
            add_header Cache-Control "no-cache";
        }
    }
}
